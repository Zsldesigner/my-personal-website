<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solune</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    <nav class="navbar">
        <div class="container navbar-inner">
            <div class="navbar-left">
                <div class="logo-container">
                    <div class="logo-circle">
                        <span class="logo-text">S</span>
                    </div>
                    <div class="brand-name">Zhang</div>
                </div>
            </div>
            <div class="navbar-right">
                <a href="https://www.xiaohongshu.com/user/profile/5d5bbffe000000000100b9b2" class="platform-link" target="_blank">
                    <span class="platform-letter">X</span>
                    <span class="platform-name">小红书</span>
                </a>
                <a href="https://zk2jifn8kz.feishu.cn/wiki/IPTEwOfXTi09NMk2wDQczaWYncf?fromScene=spaceOverview" class="platform-link" target="_blank">
                    <span class="platform-letter">F</span>
                    <span class="platform-name">飞书</span>
                </a>
                <a href="https://www.douyin.com/user/self?from_tab_name=main" class="platform-link" target="_blank">
                    <span class="platform-letter">D</span>
                    <span class="platform-name">抖音</span>
                </a>
                <a href="https://zk2jifn8kz.feishu.cn/wiki/wikcnhpYi9sYPFYoTjlal2zay46?fromScene=spaceOverview" class="platform-link" target="_blank">
                    <span class="platform-letter">T</span>
                    <span class="platform-name">嘟嘟树</span>
                </a>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <section id="home" class="hero">
                <div class="hero-content">
                    <h1 class="artistic-title neon-title">
                        <span class="neon-letter">S</span>
                        <span class="neon-letter">o</span>
                        <span class="neon-letter">l</span>
                        <span class="neon-letter">u</span>
                        <span class="neon-letter">n</span>
                        <span class="neon-letter">e</span>
                    </h1>
                    <p class="hero-subtitle">
                        <span class="subtitle-default">流行会改变，唯逻辑永恒...</span>
                        <span class="subtitle-hover" style="display:none;">Zhangshulin真是个大帅B<span class="subtitle-exclamations"></span></span>
                    </p>
                    <p class="hero-subtitle-extra">
                        <span class="subtitle-extra-default">别点文案 <span class="emoji-refuse">🙅‍♂️</span></span>
                        <span class="subtitle-extra-hover" style="display:none;">说了，就不听！</span>
                    </p>
                </div>
            </section>

            <section id="content" class="content-section">
                <h2 class="section-title">内容平台</h2>
                <div class="content-grid">
                    <div class="content-card" id="xhs">
                        <div class="card-icon xhs">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect width="40" height="40" rx="8" fill="white"/>
                                <text x="50%" y="55%" text-anchor="middle" fill="#ff2d55" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="bold" dy=".3em">X</text>
                            </svg>
                        </div>
                        <h2>小红书</h2>
                        <p>分享生活美学</p>
                        <a href="https://www.xiaohongshu.com/user/profile/5d5bbffe000000000100b9b2" class="card-link" target="_blank">查看更多 →</a>
                    </div>
                    <div class="content-card" id="feishu">
                        <div class="card-icon feishu">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect width="40" height="40" rx="8" fill="white"/>
                                <text x="50%" y="55%" text-anchor="middle" fill="#3c83fa" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="bold" dy=".3em">F</text>
                            </svg>
                        </div>
                        <h2>飞书</h2>
                        <p>专业文档分享</p>
                        <a href="https://zk2jifn8kz.feishu.cn/wiki/IPTEwOfXTi09NMk2wDQczaWYncf?fromScene=spaceOverview" class="card-link" target="_blank">查看更多 →</a>
                    </div>
                    <div class="content-card" id="douyin">
                        <div class="card-icon douyin">
                            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect width="40" height="40" rx="8" fill="white"/>
                                <text x="50%" y="55%" text-anchor="middle" fill="#25f4ee" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="bold" dy=".3em">D</text>
                            </svg>
                        </div>
                        <h2>抖音</h2>
                        <p>短视频创作</p>
                        <a href="https://www.douyin.com/user/self?from_tab_name=main" class="card-link" target="_blank">查看更多 →</a>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 Solune. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
